name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, "claude/hair-content-automation-pmaa4z"]
    paths:
      - "pwa/**"
  # 매일 콘텐츠 생성이 끝나면 Pages를 자동 재배포한다.
  # (Actions의 GITHUB_TOKEN으로 만든 커밋은 push 이벤트를 트리거하지 않으므로
  #  workflow_run 트리거가 반드시 필요하다.)
  workflow_run:
    workflows: ["Daily Hair Content Automation"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site (PWA + 지난 아티클 아카이브)
        run: |
          mkdir -p _site
          cp -r pwa/. _site/
          # 지난 날짜 폴더를 archive/ 아래로 그대로 올려 아카이브 화면에서 열람 가능하게 한다
          mkdir -p _site/archive
          for d in data/2*/; do
            [ -d "$d" ] && cp -r "$d" "_site/archive/" || true
          done
          [ -f data/index.json ] && cp data/index.json _site/archive/index.json || true
          echo "배포 용량: $(du -sh _site | cut -f1), 아카이브 $(ls -d _site/archive/2*/ 2>/dev/null | wc -l)건"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
