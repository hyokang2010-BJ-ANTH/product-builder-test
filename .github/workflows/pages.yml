name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, "claude/hair-content-automation-pmaa4z"]
    paths:
      - "pwa/**"
  # 매일 콘텐츠 생성이 끝나면 Pages를 자동 재배포한다.
  # (Actions의 GITHUB_TOKEN으로 만든 커밋은 push 이벤트를 트리거하지 않으므로
  #  workflow_run 트리거가 반드시 필요하다.)
  workflow_run:
    workflows: ["Daily Hair Content Automation"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
