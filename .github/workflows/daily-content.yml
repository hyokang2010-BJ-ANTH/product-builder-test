name: Daily Hair Content Automation

on:
  schedule:
    # 전날 20:17 UTC (= 05:17 KST) 예약.
    #
    # 왜 이 시각인가: GitHub 무료 스케줄러는 예약 시각을 보장하지 않는다.
    # 처음에는 "0 1 * * *"(10:00 KST)로 뒀는데, 실측해 보니 12일 내내
    # 4~5시간씩 밀려 실제로는 오후 2시 반경에 돌았다(평균 4시간 37분 지연).
    # 정각(:00)에 전 세계 작업이 몰리는 탓이라, 두 가지로 대응한다.
    #   1) 혼잡한 정각을 피해 :17 분으로 옮긴다
    #   2) 지연을 감안해 넉넉히 앞당겨, 밀리더라도 오전 10시 전에는 끝나게 한다
    # 빨리 끝나도 문제없다. PubMed는 최근 30일 논문을 보므로 새벽에 만들어도
    # 그날 아침에 확인하면 된다.
    - cron: "17 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-hair-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 외부 소스(PubMed/뉴스/위키미디어) 응답이 지연돼도 무한 대기하지 않도록 제한
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content pipeline
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          # 비수익화 채널이므로 CC BY-NC(비상업 한정) 논문의 그림·표도 사용한다.
          # 나중에 광고 수익을 붙일 계획이 생기면 이 줄을 지우거나 "false"로 바꿀 것.
          ALLOW_NC_FIGURES: "true"
        run: python scripts/pipeline.py

      - name: Commit and push results
        run: |
          git config user.name "hair-content-bot"
          git config user.email "actions@github.com"
          git add data/ pwa/data/ assets/fonts/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            # 데이터 폴더가 KST 날짜로 만들어지므로 커밋 메시지도 KST로 맞춘다
            git commit -m "chore: daily content $(TZ=Asia/Seoul date +%F)"
            git push
          fi
